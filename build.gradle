plugins {
    id 'java'
    id "io.freefair.lombok" version "8.13"
    id "run.halo.plugin.devtools" version "0.6.1"
    // 前台 js/css 的压缩步骤要用（ui 子项目也用同一个插件管 node）
    id "com.github.node-gradle.node" version "7.1.0"
}

group 'cc.lik.footprint'

repositories {
    // 国内镜像放最前面：本机到 repo.maven.apache.org / s01.oss.sonatype.org 是超时的
    // （实测 12 秒无响应），而 haloServer 需要下载 Halo 运行时（run.halo.app:halo），
    // 走原仓库会一直卡在超时重试上，表现为「Gradle Daemon started 之后就没动静」。
    // 能连通后可以删掉这几行。
    maven { url 'https://maven.aliyun.com/repository/public' }
    maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
    maven { url 'https://maven.aliyun.com/repository/spring' }
    mavenCentral()
    maven { url 'https://s01.oss.sonatype.org/content/repositories/releases' }
    maven { url 'https://s01.oss.sonatype.org/content/repositories/snapshots/' }
    maven { url 'https://repo.spring.io/milestone' }
}

dependencies {
    implementation platform('run.halo.tools.platform:plugin:2.26.0')
    compileOnly 'run.halo.app:api'

    testImplementation 'run.halo.app:api'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}

tasks.register('processUiResources', Copy) {
    from project(':ui').layout.buildDirectory.dir('dist')
    into layout.buildDirectory.dir('resources/main/console')
    dependsOn project(':ui').tasks.named('assemble')
    shouldRunAfter tasks.named('processResources')
}

/*
 * 前台静态资源压缩。
 *
 * 源文件原地不动，只压缩 processResources 拷进 build/resources/main 的那一份，
 * 所以必须排在 processResources 之后。详见 frontend-build/esbuild.config.mjs。
 *
 * 用 node-gradle 插件跑：ui 子项目本来就靠它管 node/pnpm，node 早已是硬依赖，
 * 这里不引入新的环境要求。
 */
// 这里刻意用 npm 而不是 ui 子项目那套 pnpm：
// 仓库根有 pnpm-workspace.yaml，pnpm 会把 frontend-build 当成 workspace 的一部分、
// 因其不在 packages 里而「已是最新」却什么都不装；加 --ignore-workspace 又会连带
// 忽略 onlyBuiltDependencies，于是 pnpm 因 esbuild 的 postinstall 被拦而报错退出。
// 这个目录只有一个依赖，用 npm 直接绕开整套纠缠。
tasks.register('minifyFrontendInstall', com.github.gradle.node.npm.task.NpmTask) {
    workingDir = file('frontend-build')
    args = ['install', '--no-audit', '--no-fund']
    inputs.file('frontend-build/package.json')
    outputs.dir('frontend-build/node_modules')
}

tasks.register('minifyFrontend', com.github.gradle.node.npm.task.NpmTask) {
    group = 'build'
    description = '压缩前台 js/css（源文件不动，只改构建产物）'
    workingDir = file('frontend-build')
    args = ['run', 'minify']

    dependsOn tasks.named('minifyFrontendInstall')
    dependsOn tasks.named('processResources')

    inputs.dir('src/main/frontend')
    inputs.dir('src/main/resources/static/js')
    inputs.dir('src/main/resources/static/css')
    inputs.files('frontend-build/esbuild.config.mjs', 'frontend-build/package.json')
    outputs.dir(layout.buildDirectory.dir('resources/main/static/js'))
    outputs.dir(layout.buildDirectory.dir('resources/main/static/css'))
}

tasks.named('classes') {
    dependsOn tasks.named('processUiResources')
    dependsOn tasks.named('minifyFrontend')
}

def haloAdminUsername = providers.gradleProperty('haloAdminUsername')
    .orElse(providers.environmentVariable('HALO_ADMIN_USERNAME'))
def haloAdminPassword = providers.gradleProperty('haloAdminPassword')
    .orElse(providers.environmentVariable('HALO_ADMIN_PASSWORD'))

halo {
    version = '2.26.0'
    debug = true

    // Halo devtools 默认使用 admin/admin 探测插件状态。已有开发数据
    // 通常改过管理员密码，此时需通过环境变量或 -P 参数提供真实凭据。
    if (haloAdminUsername.isPresent()) {
        superAdminUsername = haloAdminUsername.get()
    }
    if (haloAdminPassword.isPresent()) {
        superAdminPassword = haloAdminPassword.get()
    }
}

/*
 * Halo 的 devtools 插件只在 generatePluginComponentsIdx 执行时，
 * 临时把组件索引加入 jar 的拷贝规则。若 jar 被 Gradle 判定为
 * UP-TO-DATE，生成任务不会执行，产物就会缺少
 * META-INF/plugin-components.idx，插件 Bean 也不会被注册。
 *
 * 在这里把索引声明成 jar 的固定输入，确保增量构建和 clean build
 * 都能稳定产出可加载的插件包。
 */
def pluginComponentsIndex = layout.buildDirectory.file('tmp/META-INF/plugin-components.idx')

tasks.named('generatePluginComponentsIdx') {
    outputs.file(pluginComponentsIndex)
}

/*
 * Halo devtools 的开发容器以 build/resources/main 作为插件资源根目录。
 * 组件索引只生成到 build/tmp，因此还需同步一份到开发模式的类路径。
 */
def syncDevPluginComponentsIndex = tasks.register('syncDevPluginComponentsIndex', Copy) {
    dependsOn tasks.named('generatePluginComponentsIdx')
    from(pluginComponentsIndex)
    into layout.buildDirectory.dir('resources/main/META-INF')
}

tasks.named('jar') {
    inputs.file(pluginComponentsIndex)
    from(pluginComponentsIndex) {
        into 'META-INF'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('classes') {
    dependsOn syncDevPluginComponentsIndex
}
