<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f5f5f5" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1a1a2e" media="(prefers-color-scheme: dark)">
    <title th:text="${settings.title}">足迹 - 记录生活的每一步</title>
    <!-- 引入高德地图API -->
    <script type="text/javascript">
        window._AMapSecurityConfig = {
            securityJsCode: /*[[${settings.gaoDeKey}]]*/''
        }
    </script>
    <script type="text/javascript" th:src="|https://webapi.amap.com/maps?v=2.0&key=${settings.gaoDeKey}|"></script>



<!--    <link rel="stylesheet" href="../static/css/footprint.css" type="text/css">-->
<!--    <script type="text/javascript" src="../static/js/footprint.js"></script>-->
    <style>

    </style>
    <!-- 注入配置信息 -->
    <script th:inline="javascript">
        window.FOOTPRINT_CONFIG = {
            amapKey: /*[[${settings.gaoDeKey}]]*/ '',
            footprints: /*[[${footprints}]]*/ [],
            title: /*[[${settings.title}]]*/ '足迹',
            logoName: /*[[${settings.logoName}]]*/ '足迹',
            describe: /*[[${settings.describe}]]*/ '描述',
            hsla: /*[[${settings.hsla}]]*/ '1,75%,88%',
            mapStyle: /*[[${settings.mapStyle}]]*/ 'amap://styles/whitesmoke',
            markerStyle: /*[[${settings.markerStyle}]]*/ 'circle',
            enableHoverZoom: /*[[${settings.enableHoverZoom}]]*/ true,
            highlightScheme: /*[[${settings.highlightScheme}]]*/ 'pulse',
            highlightVisitedCities: /*[[${settings.highlightVisitedCities}]]*/ true,
            photoWallPageSize: /*[[${settings.photoWallPageSize}]]*/ 12,
            photoWallStyle: /*[[${settings.photoWallStyle}]]*/ 'focus'
        };
        // console.log('Footprint Config:', window.FOOTPRINT_CONFIG);
    </script>
</head>
<body id="footprint-page" th:class="'marker-style-' + ${settings.markerStyle}">
<canvas id="canvas"></canvas>
<div class="footprint-container">
    <!-- 地图容器 -->
    <div id="footprint-map" role="application" aria-label="足迹地图"></div>

    <!-- 页面级图片墙图层：不使用高德信息窗口，图片卡片展示在地图外围 -->
    <div id="photo-wall-layer" class="photo-wall-layer" aria-live="polite"></div>

    <!-- 左上角Logo和文字 -->
    <div class="logo-container">
        <h1 class="footprint-logo" th:text="${settings.logoName}">足迹<span class="logo-version">2024</span></h1>
        <p class="footprint-slogan" th:text="${settings.describe}">
            每一处足迹都充满了故事，那是对人生的思考和无限的风光。</p>
    </div>


    <!-- 右上角统计面板 -->
    <div id="map-stats" class="map-stats-panel show" aria-label="足迹统计">
        <div class="stats-heading">
            <div class="stats-heading-copy">
                <span class="stats-kicker">TRAVEL LOG</span>
                <span class="stats-title">足迹概览</span>
            </div>
            <span class="stats-live" aria-hidden="true"><i></i>LIVE</span>
        </div>
        <div class="stats-main">
            <div class="stats-item stats-total">
                <span class="stats-number" id="stats-total">0</span>
                <span class="stats-label">总足迹</span>
            </div>
            <div class="stats-item">
                <span class="stats-number stats-accent" id="stats-provinces">0 / 34</span>
                <span class="stats-label">省级行政区</span>
            </div>
            <div class="stats-item">
                <span class="stats-number" id="stats-cities">0</span>
                <span class="stats-label">城市</span>
            </div>
        </div>
        <div class="stats-divider"></div>
        <div class="stats-detail" id="stats-detail">
        </div>
    </div>
<!-- 底部控制栏 -->
    <div class="map-controls" id="map-controls">
        <div class="zoom-buttons" id="zoom-buttons">
            <button class="zoom-btn" id="zoom-in" data-tooltip="放大地图">+</button>
            <button class="zoom-btn" id="zoom-out" data-tooltip="缩小地图">−</button>
        </div>
        <div class="button-group">
            <button class="control-btn active" data-type="normal" data-tooltip="切换到标准地图">标准图层</button>
            <button class="control-btn" data-type="satellite" data-tooltip="切换到卫星地图">卫星图</button>
        </div>
        <div class="button-group" id="line">
            <label class="plane-switch road-switch" data-tooltip="显示/隐藏道路网络" aria-label="切换路网显示">
                <input type="checkbox" data-type="road">
                <div>
                    <div>
                        <svg viewBox="0 0 13 13">
                            <path d="M1.55989957,5.41666667 L5.51582215,5.41666667 L4.47015462,0.108333333 L4.47015462,0.108333333 C4.47015462,0.0634601974 4.49708054,0.0249592654 4.5354546,0.00851337035 L4.57707145,0 L5.36229752,0 C5.43359776,0 5.50087375,0.028779451 5.55026392,0.0782711996 L5.59317877,0.134368264 L7.13659662,2.81558333 L8.29565964,2.81666667 C8.53185377,2.81666667 8.72332694,3.01067661 8.72332694,3.25 C8.72332694,3.48932339 8.53185377,3.68333333 8.29565964,3.68333333 L7.63589819,3.68225 L8.63450135,5.41666667 L11.9308317,5.41666667 C12.5213171,5.41666667 13,5.90169152 13,6.5 C13,7.09830848 12.5213171,7.58333333 11.9308317,7.58333333 L8.63450135,7.58333333 L7.63589819,9.31666667 L8.29565964,9.31666667 C8.53185377,9.31666667 8.72332694,9.51067661 8.72332694,9.75 C8.72332694,9.98932339 8.53185377,10.1833333 8.29565964,10.1833333 L7.13659662,10.1833333 L5.59317877,12.8656317 C5.55725264,12.9280353 5.49882018,12.9724157 5.43174295,12.9907056 L5.36229752,13 L4.57707145,13 L4.55610333,12.9978962 C4.51267695,12.9890959 4.48069792,12.9547924 4.47230803,12.9134397 L4.47223088,12.8704208 L5.51582215,7.58333333 L1.55989957,7.58333333 L0.891288881,8.55114605 C0.853775374,8.60544678 0.798421006,8.64327676 0.73629202,8.65879796 L0.672314689,8.66666667 L0.106844414,8.66666667 L0.0715243949,8.66058466 L0.0715243949,8.66058466 C0.0297243066,8.6457608 0.00275502199,8.60729104 0,8.5651586 L0.00593007386,8.52254537 L0.580855011,6.85813984 C0.64492547,6.67265611 0.6577034,6.47392717 0.619193545,6.28316421 L0.580694768,6.14191703 L0.00601851064,4.48064746 C0.00203480725,4.4691314 0,4.45701613 0,4.44481314 C0,4.39994001 0.0269259152,4.36143908 0.0652999725,4.34499318 L0.106916826,4.33647981 L0.672546853,4.33647981 C0.737865848,4.33647981 0.80011301,4.36066329 0.848265401,4.40322477 L0.89131128,4.45169723 L1.55989957,5.41666667 Z" fill="currentColor"></path>
                        </svg>
                    </div>
                    <span class="street-middle"></span>
                    <span class="cloud"></span>
                    <span class="cloud two"></span>
                </div>
                <span class="switch-text">路网</span>
            </label>
            <label class="plane-switch traffic-switch" data-tooltip="显示/隐藏实时路况" aria-label="切换实时路况显示">
                <input type="checkbox" data-type="traffic">
                <div>
                    <div>
                        <svg viewBox="0 0 13 13">
                            <path d="M1.55989957,5.41666667 L5.51582215,5.41666667 L4.47015462,0.108333333 L4.47015462,0.108333333 C4.47015462,0.0634601974 4.49708054,0.0249592654 4.5354546,0.00851337035 L4.57707145,0 L5.36229752,0 C5.43359776,0 5.50087375,0.028779451 5.55026392,0.0782711996 L5.59317877,0.134368264 L7.13659662,2.81558333 L8.29565964,2.81666667 C8.53185377,2.81666667 8.72332694,3.01067661 8.72332694,3.25 C8.72332694,3.48932339 8.53185377,3.68333333 8.29565964,3.68333333 L7.63589819,3.68225 L8.63450135,5.41666667 L11.9308317,5.41666667 C12.5213171,5.41666667 13,5.90169152 13,6.5 C13,7.09830848 12.5213171,7.58333333 11.9308317,7.58333333 L8.63450135,7.58333333 L7.63589819,9.31666667 L8.29565964,9.31666667 C8.53185377,9.31666667 8.72332694,9.51067661 8.72332694,9.75 C8.72332694,9.98932339 8.53185377,10.1833333 8.29565964,10.1833333 L7.13659662,10.1833333 L5.59317877,12.8656317 C5.55725264,12.9280353 5.49882018,12.9724157 5.43174295,12.9907056 L5.36229752,13 L4.57707145,13 L4.55610333,12.9978962 C4.51267695,12.9890959 4.48069792,12.9547924 4.47230803,12.9134397 L4.47223088,12.8704208 L5.51582215,7.58333333 L1.55989957,7.58333333 L0.891288881,8.55114605 C0.853775374,8.60544678 0.798421006,8.64327676 0.73629202,8.65879796 L0.672314689,8.66666667 L0.106844414,8.66666667 L0.0715243949,8.66058466 L0.0715243949,8.66058466 C0.0297243066,8.6457608 0.00275502199,8.60729104 0,8.5651586 L0.00593007386,8.52254537 L0.580855011,6.85813984 C0.64492547,6.67265611 0.6577034,6.47392717 0.619193545,6.28316421 L0.580694768,6.14191703 L0.00601851064,4.48064746 C0.00203480725,4.4691314 0,4.45701613 0,4.44481314 C0,4.39994001 0.0269259152,4.36143908 0.0652999725,4.34499318 L0.106916826,4.33647981 L0.672546853,4.33647981 C0.737865848,4.33647981 0.80011301,4.36066329 0.848265401,4.40322477 L0.89131128,4.45169723 L1.55989957,5.41666667 Z" fill="currentColor"></path>
                        </svg>
                    </div>
                    <span class="street-middle"></span>
                    <span class="cloud"></span>
                    <span class="cloud two"></span>
                </div>
                <span class="switch-text">路况</span>
            </label>
        </div>
        <div class="button-group marker-visibility-control" id="marker-visibility">
            <label class="plane-switch marker-switch" data-tooltip="显示/隐藏足迹标记点" aria-label="切换足迹标记点显示">
                <input type="checkbox" data-type="markers" checked>
                <div aria-hidden="true">
                    <div></div>
                </div>
                <span class="switch-text">标记点</span>
            </label>
        </div>
        <button id="zoom-restore" data-tooltip="返回中国全图视图" aria-label="返回中国全图视图">中国地图</button>
        <div id="timeline-btn" data-tooltip="查看旅行时间线">时间线</div>
        <div id="messageBoards" class="amap-scale-text" data-tooltip="查看留言板" role="button" tabindex="0" aria-label="查看留言板">留言板</div>
        <button id="map-fullscreen" data-tooltip="进入全屏地图" aria-label="进入全屏地图" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path class="fullscreen-enter-icon" d="M3 9V3h6M15 3h6v6M21 15v6h-6M9 21H3v-6"></path>
                <path class="fullscreen-exit-icon" d="M9 3v6H3M21 9h-6V3M15 21v-6h6M3 15h6v6"></path>
            </svg>
        </button>
    </div>
<!--    <div id="timeline-drawer" class="drawer">
        <div class="drawer-content app-container">
            <h2>时间线</h2>
            <div id="timeline-container" style="width: 100%"></div>
            <button id="close-drawer">X</button>
        </div>
    </div>-->
</div>
<div class="timeline-drawer" id="timelineDrawer">
    <div class="drawer-header">
        <div class="drawer-header-copy">
            <span class="drawer-eyebrow">TRAVEL ARCHIVE</span>
            <h2 id="timeline-title"><i class="fas fa-clock" aria-hidden="true"></i><span>旅行时间线</span></h2>
            <p class="drawer-subtitle">按时间回看走过的地方</p>
        </div>
        <button class="time-close-btn" id="closeBtn" aria-label="关闭时间线"><span aria-hidden="true">X</span></button>
    </div>
    <div class="timeline-content" id="timelineContent">
        <div class="timeline-decoration"></div>
        <div class="timeline" id="timeline"></div>
    </div>
</div>
</body>
</html>
