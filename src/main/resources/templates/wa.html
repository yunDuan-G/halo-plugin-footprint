<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }

        canvas {
            display: block;
            background-color: #f0f0f0;
        }
    </style>
</head>
<body>
<canvas id="canvas"></canvas>
<button id="start-animation" style="position: absolute; top: 10px; left: 10px; z-index: 10;">Start Animation</button>
<button id="cancel-animation" style="position: absolute; top: 10px; left: 120px; z-index: 10;">Cancel Animation</button>
<script>
    let animationFrameId; // 用于存储 requestAnimationFrame 的 ID
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // 设置画布大小为窗口大小
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // 起点和终点
    const startPoint = {x: 100, y: 300};
    const endPoint = {x: 700, y: 400};

    // 控制点，控制抛物线形状
    const controlPoint = {
        x: (startPoint.x + endPoint.x) / 2,
        y: Math.min(startPoint.y, endPoint.y) - 150
    };

    // 动画参数
    let progress = 0;
    const duration = 2000; // 动画持续时间(ms)
    let startTime = null;

    // 绘制抛物线上的箭头
    function drawArrow(x, y, angle) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);

        // 箭头形状
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(-15, -8);
        ctx.moveTo(0, 0);
        ctx.lineTo(-15, 8);
        ctx.strokeStyle = 'blue';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.restore();
    }

    // 计算二次贝塞尔曲线上的点
    function getQuadraticBezierPoint(t, p0, p1, p2) {
        const x = (1 - t) * (1 - t) * p0.x + 2 * (1 - t) * t * p1.x + t * t * p2.x;
        const y = (1 - t) * (1 - t) * p0.y + 2 * (1 - t) * t * p1.y + t * t * p2.y;
        return {x, y};
    }

    // 计算二次贝塞尔曲线的切线角度
    function getQuadraticBezierAngle(t, p0, p1, p2) {
        const dx = 2 * (1 - t) * (p1.x - p0.x) + 2 * t * (p2.x - p1.x);
        const dy = 2 * (1 - t) * (p1.y - p0.y) + 2 * t * (p2.y - p1.y);
        return Math.atan2(dy, dx);
    }

    // 绘制虚线抛物线
    function drawDashedCurve() {
        ctx.beginPath();
        ctx.moveTo(startPoint.x, startPoint.y);
        ctx.quadraticCurveTo(controlPoint.x, controlPoint.y, endPoint.x, endPoint.y);

        ctx.setLineDash([6, 4]); // 虚线模式: 5px实线，3px空白
        ctx.strokeStyle = 'blue';
        ctx.lineWidth = 2;
        // ctx.stroke();
        // ctx.setLineDash([]); // 重置为实线
    }

    // 绘制起点和终点
    function drawPoints() {
        ctx.beginPath();
        ctx.arc(startPoint.x, startPoint.y, 9, 0, Math.PI * 2);
        ctx.fillStyle = 'red';
        ctx.fill();

        ctx.beginPath();
        ctx.arc(endPoint.x, endPoint.y, 6, 0, Math.PI * 2);
        ctx.fillStyle = 'green';
        ctx.fill();
    }

    // 动画循环
    function animate(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = timestamp - startTime;
        progress = Math.min(elapsed / duration, 1);

        // 清除画布
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 绘制完整的虚线抛物线
        drawDashedCurve();

        // 绘制起点和终点
        // drawPoints();

        // 计算当前动画点在曲线上的位置
        const currentPoint = getQuadraticBezierPoint(progress, startPoint, controlPoint, endPoint);

        // 计算当前点的切线角度
        const angle = getQuadraticBezierAngle(progress, startPoint, controlPoint, endPoint);

        // 绘制当前位置的箭头
        drawArrow(currentPoint.x, currentPoint.y, angle);

        // 绘制从起点到当前点的实线部分
        ctx.beginPath();
        ctx.moveTo(startPoint.x, startPoint.y);

        // 为了绘制实线部分，我们需要细分曲线
        const segments = 50;
        for (let i = 0; i <= segments * progress; i++) {
            const t = i / segments;
            const p = getQuadraticBezierPoint(t, startPoint, controlPoint, endPoint);
            if (i === 0) {
                ctx.moveTo(p.x, p.y);
            } else {
                ctx.lineTo(p.x, p.y);
            }
        }

        ctx.strokeStyle = 'blue';
        ctx.lineWidth = 2;
        ctx.stroke();

        // 继续动画直到完成
        if (progress < 1) {
            animationFrameId = requestAnimationFrame(animate);
        }
    }

    // 开始动画
    requestAnimationFrame(animate);

    // 响应窗口大小变化
    window.addEventListener('resize', function () {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    });
    document.getElementById('start-animation').addEventListener('click', () => {
        startTime = null; // 重置动画时间
        progress = 0; // 重置进度
        animationFrameId = requestAnimationFrame(animate);
    });

    document.getElementById('cancel-animation').addEventListener('click', () => {
        if (animationFrameId) {
            cancelAnimationFrame(animationFrameId); // 取消动画
            animationFrameId = null;
            ctx.clearRect(0, 0, canvas.width, canvas.height); // 清除画布
        }
    });
</script>
</body>
</html>
